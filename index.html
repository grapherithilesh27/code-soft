<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Soft: Web Projects</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh; padding: 48px 16px; background: #141414; color: #eaeaea;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
        }
        h1 { font-size: 2.2rem; }
        p { color: #a3a3a3; margin: 8px 0 36px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 820px; margin: 0 auto; }
        a.card {
            display: block; padding: 28px 20px; border-radius: 16px; background: #1e1e1e; color: inherit;
            text-decoration: none; transition: transform .2s, background .2s;
        }
        a.card:hover { transform: translateY(-4px); background: #262626; }
        .icon { font-size: 2.6rem; }
        h2 { font-size: 1.2rem; margin: 10px 0 6px; }
        small { color: #a3a3a3; }
    </style>
</head>
<body>
    <h1>Code Soft</h1>
    <p>Three small web projects built with plain HTML, CSS and JavaScript.</p>
    <div class="grid">
        <a class="card" href="calculator/"><div class="icon">🧮</div><h2>Calculator</h2><small>Chained operations and keyboard input</small></a>
        <a class="card" href="countdown/"><div class="icon">☢️</div><h2>Boiler Countdown</h2><small>Animated countdown timer</small></a>
        <a class="card" href="portfolio/"><div class="icon">👤</div><h2>Portfolio</h2><small>Responsive personal site</small></a>
    </div>
</body>
</html>
